server {
    listen 80;
    server_name localhost;

    # ── Frontend: proxy para o container de HTML/JS estático ──
    location / {
        proxy_pass          http://frontend:80;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── API PHP: todas as rotas /api e /api/* vão para o php-fpm ──
    # O php-fpm lê os arquivos via bind mount em /var/www/html
    location ~ ^/api(/.*)?$ {
        fastcgi_pass    php:9000;
        fastcgi_param   SCRIPT_NAME      /index.php;  # Define o script PHP a ser executado
        fastcgi_param   SCRIPT_FILENAME /var/www/html/index.php;  # Caminho absoluto do script PHP no container
        fastcgi_param   QUERY_STRING     $query_string;  # Passa a query string para o PHP
        fastcgi_param   REQUEST_METHOD   $request_method;  # Passa o método HTTP para o PHP
        fastcgi_param   CONTENT_TYPE     $content_type;  # Passa o tipo de conteúdo para o PHP
        fastcgi_param   CONTENT_LENGTH   $content_length;  # Passa o tamanho do conteúdo para o PHP
        fastcgi_param   SERVER_PROTOCOL $server_protocol;  # Passa o protocolo do servidor para o PHP
        fastcgi_param   REMOTE_ADDR      $remote_addr;  # Passa o endereço IP do cliente para o PHP
        include         fastcgi_params;
    }
}
