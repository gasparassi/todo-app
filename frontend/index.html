<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo — Docker</title>

    <!-- Bootstrap 5 + Bootstrap Icons (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand bg-primary shadow-sm" data-bs-theme="dark">
      <div class="container">
        <span class="navbar-brand fw-semibold text-white">
          <i class="bi bi-check2-square me-1"></i>
          ToDo App
        </span>
        <button
          id="theme-toggle"
          class="btn btn-outline-light btn-sm"
          type="button"
          data-bs-toggle="tooltip"
          data-bs-placement="bottom"
          data-bs-title="Alternar tema claro/escuro"
        >
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </nav>

    <main class="container-fluid py-4 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 app-panel">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h1 class="h3 mb-4 text-center"><i class="bi bi-journal-check text-primary"></i> Minhas Tarefas</h1>

              <!-- Formulário de nova tarefa -->
              <form id="task-form" class="needs-validation mb-3" novalidate>
                <div class="input-group input-group-lg has-validation">
                  <span class="input-group-text"><i class="bi bi-pencil"></i></span>
                  <input
                    type="text"
                    id="task-input"
                    class="form-control"
                    placeholder="Nova tarefa..."
                    maxlength="255"
                    required
                    aria-label="Nova tarefa"
                  />
                  <button class="btn btn-primary" type="submit" id="add-btn">
                    <i class="bi bi-plus-lg"></i>
                    <span class="d-none d-sm-inline">Adicionar</span>
                  </button>
                  <div class="invalid-feedback">Digite o título da tarefa.</div>
                </div>
                <div class="form-text text-end"><span id="char-count">0</span>/255</div>
              </form>

              <!-- Progresso -->
              <div class="mb-3">
                <div class="d-flex justify-content-between small text-body-secondary mb-1">
                  <span>Progresso</span>
                  <span id="progress-label">0 de 0 concluídas</span>
                </div>
                <div
                  class="progress"
                  role="progressbar"
                  aria-label="Progresso das tarefas"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  style="height: 10px"
                >
                  <div id="progress-bar" class="progress-bar progress-bar-striped bg-success" style="width: 0%"></div>
                </div>
              </div>

              <!-- Filtros -->
              <ul class="nav nav-pills nav-fill mb-3 small" id="filters">
                <li class="nav-item">
                  <button class="nav-link active" data-filter="all">
                    Todas <span class="badge rounded-pill text-bg-secondary" id="count-all">0</span>
                  </button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" data-filter="pending">
                    Pendentes <span class="badge rounded-pill text-bg-warning" id="count-pending">0</span>
                  </button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" data-filter="done">
                    Concluídas <span class="badge rounded-pill text-bg-success" id="count-done">0</span>
                  </button>
                </li>
              </ul>

              <!-- Lista de tarefas -->
              <ul id="task-list" class="list-group list-group-flush">
                <li class="list-group-item text-center py-4 text-body-secondary">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Carregando tarefas...
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-3 text-center small text-body-secondary border-top">
      <i class="bi bi-box-seam"></i> Nginx + PHP-FPM + MySQL + Front-end em Docker
    </footer>

    <!-- Modal de confirmação de exclusão -->
    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="confirm-title">
              <i class="bi bi-exclamation-triangle-fill text-danger"></i> Excluir tarefa
            </h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">Deseja realmente excluir a tarefa <strong id="confirm-task-title"></strong>?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="confirm-delete">
              <i class="bi bi-trash"></i> Excluir
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Área de notificações (toasts) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js?v=2"></script>
  </body>
</html>
